name: 韩国市场信号

on:
  schedule:
    # 北京时间 07:50 / 08:30 / 09:40 / 14:30 / 21:30（工作日）
    # 07:50 提前抓取一次（应对 kimpremium 数据源更新时间不稳定）
    # 08:30 抓取数据 + Server酱微信推送
    - cron: '50 23 * * 0-4'   # 北京时间 07:50 (周一-周五)
    - cron: '30 0 * * 1-5'    # 北京时间 08:30 (周一-周五) - 推送
    - cron: '40 1 * * 1-5'    # 北京时间 09:40 (周一-周五)
    - cron: '30 6 * * 1-5'    # 北京时间 14:30 (周一-周五)
    - cron: '30 13 * * 1-5'   # 北京时间 21:30 (周一-周五)
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data
        run: python scripts/fetch_data.py

      - name: Compute signals
        run: python scripts/compute_signals.py

      - name: Send WeChat alert
        # 仅在北京时间 08:30 的 cron 触发时推送，避免 push 和其他时段重复推送
        if: github.event_name == 'schedule' && github.event.schedule == '30 0 * * 1-5'
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python scripts/send_alert.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes to commit" || ( \
            git commit -m "auto update $(date -u +%Y-%m-%d)" && \
            git push \
          )
