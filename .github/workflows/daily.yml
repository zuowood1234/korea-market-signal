name: 韩国市场信号

on:
  schedule:
    # 第一次推送：北京时间 13:30（工作日）— T+0 指数 + T+1 KOFIA 数据（AUM 为前一交易日）
    - cron: '30 5 * * 1-5'
    # 第二次推送：北京时间 22:30（工作日）— 在 22:00 的 7709/7747 AUM 工作流提交完后跑，含当日新鲜 AUM，全量刷新
    #   注：GitHub 定时漂移约 +1h20m，实际落地约 14:50 / 23:50
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data
        run: python scripts/fetch_data.py

      - name: Compute signals
        run: python scripts/compute_signals.py

      - name: Send WeChat alert
        # 定时触发(schedule) 或 手动触发(workflow_dispatch) 时推送；push 触发不推送（避免提交历史里反复发）
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python scripts/send_alert.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes to commit" || ( \
            git commit -m "auto update $(date -u +%Y-%m-%d)" && \
            git pull --rebase origin main && \
            git push \
          )
