name: 韩国市场信号

on:
  schedule:
    # 北京时间 13:30（工作日）— 提前触发以抵消 GitHub 定时漂移，尽量在查看前落地（韩股 14:30 北京收盘，仍在其后）
    # kimpremium 14:11 更新 T+1 数据后统一抓取；抓取完成后自动推送 Server 酱
    - cron: '30 5 * * 1-5'    # 北京时间 13:30 (周一-周五) - 抓取 + 推送（提前量抵消 drift）
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data
        run: python scripts/fetch_data.py

      - name: Compute signals
        run: python scripts/compute_signals.py

      - name: Send WeChat alert
        # 仅在 14:35 的 schedule 触发时推送，push 触发不推送
        if: github.event_name == 'schedule'
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python scripts/send_alert.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes to commit" || ( \
            git commit -m "auto update $(date -u +%Y-%m-%d)" && \
            git push \
          )
