name: 韩国市场信号

on:
  schedule:
    # 北京时间 15:00（工作日）— 韩股 14:30 收盘后抓取 T+0 收盘价 + KOFIA T+1 数据
    # 抓取完成后自动推送 Server 酱（约 15:03-15:05）
    - cron: '0 7 * * 1-5'    # 北京时间 15:00 (周一-周五) - 抓取 + 推送
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data
        run: python scripts/fetch_data.py

      - name: Compute signals
        run: python scripts/compute_signals.py

      - name: Send WeChat alert
        # 仅在 14:35 的 schedule 触发时推送，push 触发不推送
        if: github.event_name == 'schedule'
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python scripts/send_alert.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes to commit" || ( \
            git commit -m "auto update $(date -u +%Y-%m-%d)" && \
            git push \
          )
